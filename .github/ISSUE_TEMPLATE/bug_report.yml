name: Signaler un bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Qu'as-tu fait, qu'attendais-tu, que s'est-il passé à la place ?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Pénombre
      placeholder: ex. 0.5.0 (clic droit sur Penombre.exe > Propriétés > Détails)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: ex. Windows 10 22H2, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: render
    attributes:
      label: Rendu
      options:
        - Shader
        - Voile
        - Les deux
  - type: textarea
    id: setup
    attributes:
      label: Configuration
      description: Nombre de clients Dofus, fenêtré ou plein écran fenêtré, écrans (nombre, résolution, mise à l'échelle).
      placeholder: ex. 2 clients, plein écran fenêtré, 2 écrans 1920×1080 à 100 % et 2560×1440 à 125 %
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic
      description: Menu de la zone de notification > Copier le diagnostic, puis colle-le ici. Il contient les titres de tes fenêtres (noms de personnages) : remplace-les par XXX si tu préfères.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Journal
      description: Menu de la zone de notification > Ouvrir le journal, puis colle les dernières lignes (surtout les lignes ERROR).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
      description: Glisse-dépose des images ici si c'est utile.
