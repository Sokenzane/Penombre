name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A text key written twice compiles fine but stops the app at start.
      - name: Check that every interface text key is unique
        shell: bash
        run: |
          dups=$(grep -oE '^ +\{ "[A-Za-z0-9]+", +new\[\]' src/Penombre.cs | grep -oE '"[A-Za-z0-9]+"' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "::error::Text keys used twice in T: $dups"; exit 1; fi

      - name: Compile with the .NET Framework C# compiler
        shell: cmd
        run: build.bat ci

      - name: Upload the exe
        uses: actions/upload-artifact@v7
        with:
          name: Penombre
          path: dist/Penombre.exe

  # Only for v* tags, in a job of its own: the only one allowed to write (publish the release).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get the exe
        uses: actions/download-artifact@v4
        with:
          name: Penombre
          path: dist

      - name: Prepare the release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "Version = \"$version\"" src/Penombre.cs; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Program.Version in src/Penombre.cs"
            exit 1
          fi
          tr -d '\r' < CHANGELOG.md | awk -v v="$version" '$0 == "## " v {f=1; next} /^## /{f=0} f' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $version' section in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "### Téléchargement"
            echo
            echo "[**Penombre.exe**](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Penombre.exe) — Windows 10/11 64 bits, rien à installer. Pour l'emporter sur une clé USB, coche le mode portable dans Réglages > Général."
            echo
            echo "SHA-256 : \`$(sha256sum dist/Penombre.exe | cut -d' ' -f1)\`"
          } >> notes.md
          cat notes.md

      # Releases are immutable once published: create a draft with the exe, then publish it.
      - name: Create the release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Pénombre ${{ github.ref_name }}
          body_path: notes.md
          files: dist/Penombre.exe
          draft: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
